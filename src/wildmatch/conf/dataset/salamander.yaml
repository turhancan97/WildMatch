# Dataset registry entry `salamander` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=salamander`; the `registry` block is metadata for tools, not read by the probe.
name: "SalamanderID2025"
animal: "SalamanderID2025"
root: "${paths.data_root}/SalamanderID2025"
metadata_file: "split_time_closed_no_background.csv"
label_col: "identity"
mask_col: "mask"
no_background: false
image_variant: "no_background"
split_col: "split"
database_split_value: "database"
query_split_value: "query"
calibration_size: 100
registry:
  key: "salamander"
  paper_key: "salamander"
  label: "Salamander"
  source: "SalamanderID2025"
  paper: true
  order: 8
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/wildlife-reid-10k/SalamanderID2025/loma-finetuned/legacy-loma-mined/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/wildlife-reid-10k/SalamanderID2025/rdd-finetuned/legacy-rdd-mined/epoch_299/model.safetensors"
  licence: null   # to verify before release (Phase 4)
  # How `wildmatch prepare build/finish` rebuilds this entry (wildmatch.data.prepare.sources).
  prepare:
    builder: salamander
    merge: union  # an occluding finger splits one salamander into several detections
    prompt: Salamander
    threshold_override: ["query/images/9d1fc96e28c0058e_1277.jpg=0.1"]
    split_map: "database=train,query=test"
    split_map_column: split_train_test
  # Mining view settings (wildmatch.mining.wildlife_dataset.config_from_registry): the view folders are
  # named after this column, so database/query is mapped to train/test.
  mining:
    split_column: split_train_test
  # Where the data comes from. raw: the published source; derived: the files this registry entry
  # reads that are made from it; reproducible: whether this repository can rebuild them.
  download:
    raw: "kaggle competition animal-clef-2025 (metadata.csv and images/SalamanderID2025/; accept the competition rules first)"
    derived: "split_time_closed.csv and images: wildmatch prepare build (byte-identical); SAM 3 masks; metadata: wildmatch prepare finish"
    reproducible: true
