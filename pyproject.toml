[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wildmatch"
version = "0.1.0.dev0"
description = "Weakly supervised image matcher adaptation for wildlife re-identification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "omegaconf",
    "hydra-core==1.3.2",
    "pycocotools",
    "safetensors>=0.4.0",
    "timm",
    "transformers",
    "pytorch-metric-learning",
    "wildlife-tools",
    "wildlife-datasets",
    # wildlife-tools needs these two; neither is on PyPI, so they come from pinned git commits.
    "gluefactory",
    "lightglue",
]

[project.scripts]
wildmatch = "wildmatch.cli:main"

[project.optional-dependencies]
# Exactly one torch build must be chosen: `uv sync --extra cpu` or `uv sync --extra cu126`.
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
cu126 = ["torch==2.8.0", "torchvision==0.23.0"]
# Local feature matchers (RDD-LightGlue, ALIKED/SuperPoint-LightGlue, LoMa) through Vismatch.
matchers = ["vismatch"]
wandb = ["wandb"]
# Slot for pair mining (merged in later from rdd-parallel-benchmark).
mining = []

[dependency-groups]
dev = ["pytest>=8", "ruff==0.15.5"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
# gluefactory requires LightGlue from an unpinned git URL; pin it to the commit `ex-reid` used.
override-dependencies = [
    "lightglue @ git+https://github.com/cvg/LightGlue.git@746fac2c042e05d1865315b1413419f1c1e7ba55",
    # A vismatch dependency that installs a top-level `scripts` package (shadowing this
    # repository's scripts/); none of the matchers used here needs it, and ex-reid never had it.
    "uniception ; sys_platform == 'never'",
]
# Pinned to the versions of the `ex-reid` environment that produced the paper's numbers
# (tag paper-v1), so the refactor can be checked for identical results. Loosen deliberately.
constraint-dependencies = [
    "numpy==2.4.2",
    "pandas==3.0.0",
    "pillow==12.1.0",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "omegaconf==2.3.0",
    "pycocotools==2.0.11",
    "safetensors==0.7.0",
    "timm==1.0.24",
    "transformers==5.0.0",
    "pytorch-metric-learning==2.9.0",
    "kornia==0.8.2",
    "einops==0.8.2",
    "poselib==2.0.5",
    "opencv-python==4.11.0.86",
    # albumentations (via gluefactory) pulls the headless wheel; both wheels write the same
    # cv2 package, so both are pinned to the version that ended up active in ex-reid.
    "opencv-python-headless==4.11.0.86",
    "tqdm==4.67.3",
    "pyyaml==6.0.3",
    "wandb==0.24.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
wildlife-tools = { git = "https://github.com/WildlifeDatasets/wildlife-tools.git", rev = "e762a6c4de60ff1be4ae9edb4c2b6ec572fee982" }
wildlife-datasets = { git = "https://github.com/WildlifeDatasets/wildlife-datasets.git", rev = "fc702c3ceb17e68cc1ed822db4c6b9c5e90cca42" }
gluefactory = { git = "https://github.com/cvg/glue-factory.git", rev = "1f56839db2242929960d70f85bfac6c19ef2821c" }
vismatch = { git = "https://github.com/gmberton/vismatch.git", rev = "4a743b75749a3770af59d275483ed341dea51ff0" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/wildmatch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The paper tooling under scripts/ is imported by tests as `scripts.<module>` or by module name.
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA device",
    "data: needs the datasets or experiment outputs on this machine",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["video", "notebooks", "docs", "site", "overrides"]

[tool.ruff.lint]
# pyflakes (undefined names, unused imports/variables), pycodestyle errors/warnings, import order.
select = ["E", "F", "W", "I"]
# Long lines and one-line statements are left to the formatter; E731/E741 are style choices here.
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["wildmatch", "paper"]
