# Dataset registry entry `nyala` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=nyala`; the `registry` block is metadata for tools, not read by the probe.
name: "WildlifeReID-10k"
animal: "NyalaData"
root: "${paths.data_root}/WildlifeReID-10k"
metadata_file: "metadata_no_background/metadata_NyalaData.csv"
label_col: "identity"
mask_col: "mask"
no_background: false
image_variant: "no_background"
split_col: "split"
database_split_value: "train"
query_split_value: "test"
calibration_size: 100
registry:
  key: "nyala"
  paper_key: "nyala"
  label: "Nyala"
  source: "NyalaData"
  paper: true
  order: 1
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/wildlife-reid-10k/NyalaData/loma-finetuned/legacy/epoch_299/model__actual_nyala.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/wildlife-reid-10k/NyalaData/rdd-finetuned/legacy-rdd-mined-relaxed/epoch_299/model.safetensors"
  licence: null   # to verify before release (Phase 4)
  # How `wildmatch prepare build/finish` rebuilds this entry (wildmatch.data.prepare.sources).
  prepare:
    builder: wildlifereid10k
    # One animal per photo: keep the best SAM 3 detection. Photos often show several animals
    # (NyalaData, GiraffeZebraID); merging them all ("union", right for the Salamander finger
    # splits) disagreed with the paper inputs in the 2026-10-04 pilot.
    merge: best
    include: null
  # Where the data comes from. raw: the published source; derived: the files this registry entry
  # reads that are made from it; reproducible: whether this repository can rebuild them.
  download:
    raw: "kaggle:wildlifedatasets/wildlifereid-10k (wildlife-datasets WildlifeReID10k)"
    derived: "split table: wildmatch prepare build (exact); masks: SAM 3 (new, the original masking method is not recorded); metadata: wildmatch prepare finish"
    reproducible: true
