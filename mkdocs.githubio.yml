# Deploy config while wildmatch.gmum.net has no DNS record (2026-10-07): the same site, served at
# https://turhancan97.github.io/WildMatch/ and without docs/CNAME (with it, GitHub would redirect to
# the unresolved domain). Deploy with
#   mkdocs gh-deploy --strict -f mkdocs.githubio.yml
# Once the DNS points wildmatch.gmum.net at GitHub Pages, deploy with mkdocs.yml instead and delete
# this file.
INHERIT: mkdocs.yml
site_url: https://turhancan97.github.io/WildMatch/
exclude_docs: |
  CNAME
