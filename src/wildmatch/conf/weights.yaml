# Paper checkpoints published on the Hugging Face Hub (`wildmatch weights`): the matcher-only
# fine-tuned LoMa and RDD-LightGlue weights behind the paper's results, located by the SHA-256
# that the paper snapshot's 395 runs recorded (2026-10-04). `local` is the file's path under
# `paths.checkpoint_root` and equals the registry's `checkpoints.custom.<matcher>`; `hub` is its
# name in the Hub repository. `protocol` files are training provenance that the Vismatch loader
# reads next to the weights (part of the checkpoint fingerprint), shipped alongside.
# czechlynx_open also serves czechlynx_unseen_eval (the paper's unseen-identity protocol).
# Not published: descriptor-only and joint checkpoints, and datasets outside the paper.
# Release licence of these checkpoints: CC BY-NC 4.0 (user decision 2026-10-06; THIRD_PARTY_LICENSES.md).
