# Dataset registry entry `czechlynx_unseen_eval` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=czechlynx_unseen_eval`; the `registry` block is metadata for tools, not read by the probe.
name: "CzechLynx_v2"
animal: "CzechLynx"
root: "${paths.data_root}/CzechLynx_v2"
metadata_file: "${oc.env:CZECHLYNX_UNSEEN_EVAL_METADATA_FILE,metadata/czechlynx-unseen-eval/metadata_unseen_eval.csv}"
label_col: "unique_name"
mask_col: "mask"
no_background: true
image_variant: "no_background"
split_col: "unseen_eval_split"
database_split_value: "database"
query_split_value: "query"
calibration_size: 100
registry:
  key: "czechlynx_unseen_eval"
  paper_key: null
  label: null
  source: "CzechLynx"
  paper: false
  order: null
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/czechlynx-time-open/loma-b-finetuned-loma-mined-legacy/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/czechlynx-time-open/rdd-finetuned-loma-mined-legacy-relaxed/epoch_299/model.safetensors"  # shared-recipe retrain (2026-10-09); paper: czechlynx-time-open/rdd-finetuned-loma-mined-legacy/epoch_299/model.safetensors
  licence: "CC BY 4.0 (Kaggle picekl/czechlynx)"  # checked 2026-10-06 (THIRD_PARTY_LICENSES.md)
  prepare:
    builder: unseen  # wildmatch prepare unseen-split
  # Where the data comes from. raw: the published source; derived: the files this registry entry
  # reads that are made from it; reproducible: whether this repository can rebuild them.
  download:
    raw: "kaggle:picekl/czechlynx (wildlife-datasets CzechLynx; confirmed by the user 2026-10-04: CzechLynx v2 is the internal name of this release)"
    derived: "wildmatch prepare unseen-split (from czechlynx_open, encounter groups, date order)"
    reproducible: true
