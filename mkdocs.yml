# Project page for the WildMatch paper (arXiv:2610.07384). Source lives in docs/, the built
# site goes to site/ (gitignored) and is deployed to the gh-pages branch with
# `mkdocs gh-deploy`; docs/CNAME serves it at wildmatch.gmum.net, the address the preprint
# gives. Until the decision date the repository stays private and the site is not deployed
# (see AGENTS.md, "Project page").
site_name: WildMatch
site_description: Weakly supervised image matcher adaptation for wildlife re-identification
site_url: https://wildmatch.gmum.net/
repo_url: https://github.com/turhancan97/WildMatch
repo_name: WildMatch
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true
copyright: © 2026 The WildMatch Authors

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  # WildMatch logo package (kept out of the paper repository by its .gitignore;
  # web-sized copies made from reports/project_page/logo/).
  logo: assets/logo/wildmatch-logo-256.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Google Analytics 4 (user request 2026-10-07; no consent banner, user decision). Material injects
# gtag.js with this Measurement ID on every page; mkdocs.githubio.yml inherits it.
extra:
  analytics:
    provider: google
    property: G-W9GXV5470E

extra_css:
  - assets/css/extra.css

extra_javascript:
  # Interactive figures (results explorer, training-cost plot) use Plotly from a
  # pinned CDN build; the page modules are added in docs/assets/js/ as they land.
  - path: https://cdn.plot.ly/plotly-2.35.2.min.js
    defer: true
  - path: assets/js/page.js
    type: module
  - assets/js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

nav:
  - Home: index.md
  - Demo:
      - demo/index.md
      - Before and after: demo/before-after.md
      - Rank changes: demo/rank-changes.md
      - Mined pairs: demo/mined-pairs.md
      - Background masking: demo/masking.md
      - Synthetic matching: demo/synthetic.md
  - Method: method.md
  - Datasets:
      - datasets/index.md
      - Data challenges: datasets/challenges.md
  - Results:
      - results/index.md
      - Qualitative: results/qualitative.md
      - Training cost: results/training-cost.md
  - Reproduce:
      - reproduce/index.md
      - Pair mining: reproduce/mining.md
      - Matcher fine-tuning: reproduce/finetuning.md
      - Evaluation: reproduce/probing.md
      - Few-shot views: reproduce/fewshot.md
  - Paper & Code: paper.md
