# Dataset registry entry `jaguar` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=jaguar`; the `registry` block is metadata for tools, not read by the probe.
name: "JaguarReID"
animal: "JaguarReID"
root: "${paths.data_root}/jaguar"
metadata_file: "jaguar_reid_v2_no_background.csv"
label_col: "identity"
mask_col: "mask"
no_background: false
image_variant: "no_background"
split_col: "split_v2"
database_split_value: "database"
query_split_value: "query"
calibration_size: 100
registry:
  key: "jaguar"
  paper_key: "jaguar"
  label: "Jaguar"
  source: "Kaggle Jaguar Re-ID"
  paper: false
  order: 1
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/wildlife-reid-10k/JaguarReID/loma-finetuned/legacy-loma-mined/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/wildlife-reid-10k/JaguarReID/rdd-finetuned/legacy-loma-mined/epoch_299/model.safetensors"
  licence: "Kaggle Jaguar Re-ID competition rules (to confirm)"  # checked 2026-10-06 (THIRD_PARTY_LICENSES.md)
  prepare:
    builder: jaguar  # wildmatch prepare jaguar prepare|embed|split
  # Where the data comes from. raw: the published source; derived: the files this registry entry
  # reads that are made from it; reproducible: whether this repository can rebuild them.
  download:
    raw: "Kaggle Jaguar Re-ID competition training data (train.csv, train/), user-supplied"
    derived: "wildmatch prepare jaguar prepare, embed, split"
    reproducible: true
