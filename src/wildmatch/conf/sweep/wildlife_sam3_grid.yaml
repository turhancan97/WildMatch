# The rest of the paper's candidate-budget grid on the SAM 3 WildlifeReID-10k inputs: the shortlist
# methods at k = 10, 50, 100, 500, 1000. k = 250 and the budget-independent methods (cosine, the
# frozen weighted linear probe) ran in sweep `wildlife_sam3` (array 524372). Features are cached per
# image, so these tasks redo only the matching.
description: Paper WildlifeReID-10k datasets on the SAM 3 inputs, remaining budgets
datasets: [hyenaid2022, leopardid2022, nyala, seastarreid2023, whaleshark, zindi]
candidate_k: [10, 50, 100, 500, 1000]
max_concurrent: 12
variants:
  - {method: wildfusion}
  - {method: vismatch, matcher: loma}
  - {method: vismatch, matcher: loma, checkpoint: custom}
  - {method: vismatch, matcher: rdd-lightglue}
  - {method: vismatch, matcher: rdd-lightglue, checkpoint: custom}
