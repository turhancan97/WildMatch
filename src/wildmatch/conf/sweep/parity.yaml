# Refactor parity set (notes/parity_reference.md): SalamanderID2025 at k=50, the seven tasks of
# the paper-v1 reference array 524155, in the same order.
description: Refactor parity reference set (SalamanderID2025, k=50)
datasets: [salamander]
candidate_k: [50]
max_concurrent: 12
variants:
  - {method: cosine}
  - {method: wildfusion}
  - {method: vismatch, matcher: loma}
  - {method: vismatch, matcher: loma, checkpoint: custom}
  - {method: vismatch, matcher: rdd-lightglue}
  - {method: vismatch, matcher: rdd-lightglue, checkpoint: custom}
  - {method: linear_probe, train_mode: classifier, class_weighting: weighted}
# The paper's RDD-LightGlue checkpoints, pinned (2026-10-09): the registry default became the shared-recipe
# retrain, and this sweep reproduces or extends the paper's runs.
dataset_overrides:
  salamander:
    checkpoints: {custom: {rdd-lightglue: "/shared/sets/datasets/vision/czechlynx/checkpoints/wildlife-reid-10k/SalamanderID2025/rdd-finetuned/legacy-rdd-mined/epoch_299/model.safetensors"}}
