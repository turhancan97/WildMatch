# Dataset registry entry `czechlynx_closed` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=czechlynx_closed`; the `registry` block is metadata for tools, not read by the probe.
name: "CzechLynx_v2"
animal: "CzechLynx"
root: "${paths.data_root}/CzechLynx_v2"
metadata_file: "CzechLynxDataset-Metadata-Real.csv"
label_col: "unique_name"
mask_col: "mask"
no_background: true
image_variant: "no_background"
split_col: "split-time_closed"
database_split_value: "train"
query_split_value: "test"
calibration_size: 100
registry:
  key: "czechlynx_closed"
  paper_key: "lynx_closed"
  label: "Lynx (closed)"
  source: "CzechLynx v2"
  paper: true
  order: 9
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/czechlynx-time-closed/loma-b-finetuned-loma-mined-legacy/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/czechlynx-time-closed/rdd-finetuned-loma-mined-legacy/epoch_299/model.safetensors"
    descriptor-fine-tuned:
      loma: "${paths.checkpoint_root}/czechlynx-time-closed/loma-b-descriptor-finetuned-legacy/epoch_252/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/czechlynx-time-closed/rdd-descriptor-finetuned-loma-mined-legacy/epoch_175/model.safetensors"
    joint-fine-tuned:
      loma: "${paths.checkpoint_root}/czechlynx-time-closed/loma-b-joint-finetuned-loma-mined-legacy/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/czechlynx-time-closed/rdd-joint-finetuned-loma-mined-legacy/epoch_299"
  licence: null   # to verify before release (Phase 4)
  download: null  # Phase 4: download route or "user-supplied"
