# Dataset registry entry `whaleshark` (generated 2026-10-04 from the launcher profile of the same name).
# Selected with `dataset=whaleshark`; the `registry` block is metadata for tools, not read by the probe.
name: "WildlifeReID-10k"
animal: "WhaleSharkID"
root: "${paths.data_root}/WildlifeReID-10k"
metadata_file: "metadata_no_background/metadata_WhaleSharkID.csv"
label_col: "identity"
mask_col: "mask"
no_background: false
image_variant: "no_background"
split_col: "split"
database_split_value: "train"
query_split_value: "test"
calibration_size: 100
registry:
  key: "whaleshark"
  paper_key: "whale_shark"
  label: "Whale Shark"
  source: "WhaleSharkID"
  paper: true
  order: 6
  # Default fine-tuned checkpoints per sweep checkpoint label (epoch 299 unless stated):
  # custom = matcher only, descriptor-fine-tuned = descriptor only, joint-fine-tuned =
  # descriptor + matcher trained together. A sweep row whose label has no entry fails closed.
  checkpoints:
    custom:
      loma: "${paths.checkpoint_root}/wildlife-reid-10k/WhaleSharkID/loma-finetuned/legacy-rdd-mined/epoch_299/model.safetensors"
      rdd-lightglue: "${paths.checkpoint_root}/wildlife-reid-10k/WhaleSharkID/rdd-finetuned/legacy-rdd-mined/epoch_299/model.safetensors"
  licence: null   # to verify before release (Phase 4)
  # Where the data comes from. raw: the published source; derived: the files this registry entry
  # reads that are made from it; reproducible: whether this repository can rebuild them.
  download:
    raw: "kaggle:wildlifedatasets/wildlifereid-10k (wildlife-datasets WildlifeReID10k)"
    derived: "masked crops (masked_images/) and the metadata_*_no_background/ tables were made by the team; their script and a publication route are still open"
    reproducible: false
